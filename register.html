<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — RunPulse India</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-rose-50 via-white to-indigo-50 min-h-screen flex flex-col">

<header class="py-6 text-center">
  <a href="index.html" class="inline-flex items-center gap-1.5">
    <span class="text-2xl">🏃</span>
    <span class="font-display font-extrabold text-2xl"><span class="brand-gradient-text">Run</span><span class="text-gray-900">Pulse</span></span>
  </a>
</header>

<main class="flex-1 flex items-start justify-center px-4 pb-12">
  <div class="w-full max-w-sm bg-white rounded-2xl border border-gray-100 shadow-xl p-7">
    <h1 class="font-display font-bold text-xl text-center">Create your account</h1>
    <p class="text-center text-xs text-gray-500 mt-1 mb-5">Join thousands of runners across India</p>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-500">Full Name</label>
        <input required id="regName" type="text" placeholder="Your full name" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">Email</label>
        <input required id="regEmail" type="email" placeholder="you@example.com" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">Mobile Number</label>
        <div class="mt-1 flex gap-2">
          <span class="border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-500">+91</span>
          <input required id="regPhone" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" class="flex-1 border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">Password</label>
        <input required id="regPassword" type="password" minlength="8" placeholder="At least 8 characters" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        <div class="mt-1.5 h-1 rounded-full bg-gray-100 overflow-hidden">
          <div id="pwStrengthBar" class="h-full w-0 bg-rose-400 transition-all"></div>
        </div>
        <p id="pwStrengthLabel" class="text-[11px] text-gray-400 mt-1">Password strength</p>
      </div>
      <label class="flex items-start gap-2 text-xs text-gray-500">
        <input required type="checkbox" class="mt-0.5 accent-rose-600"> I agree to the <a href="terms-of-service.html" class="text-rose-600 font-medium">Terms of Service</a> and <a href="privacy-policy.html" class="text-rose-600 font-medium">Privacy Policy</a>.
      </label>
      <button type="submit" class="w-full rp-btn-primary text-white font-semibold py-2.5 rounded-full">Create Account</button>
    </form>

    <p id="registerSuccess" class="hidden text-center text-sm text-emerald-600 font-semibold mt-4">✓ Account created successfully (demo)</p>

    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-gray-100"></div><span class="text-xs text-gray-400">or continue with</span><div class="flex-1 h-px bg-gray-100"></div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <button type="button" class="border border-gray-200 rounded-lg py-2 text-sm font-medium hover:bg-gray-50">Google</button>
      <button type="button" class="border border-gray-200 rounded-lg py-2 text-sm font-medium hover:bg-gray-50">Facebook</button>
    </div>

    <p class="text-center text-sm text-gray-500 mt-6">Already have an account? <a href="login.html" class="text-rose-600 font-semibold">Login</a></p>
  </div>
</main>

<footer class="text-center text-xs text-gray-400 pb-6">© 2026 RunPulse India · <a href="privacy-policy.html" class="hover:text-gray-600">Privacy</a> · <a href="terms-of-service.html" class="hover:text-gray-600">Terms</a></footer>

<script src="assets/js/auth.js"></script>
</body>
</html>
