<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — RunPulse India</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gradient-to-br from-rose-50 via-white to-indigo-50 min-h-screen flex flex-col">

<header class="py-6 text-center">
  <a href="index.html" class="inline-flex items-center gap-1.5">
    <span class="text-2xl">🏃</span>
    <span class="font-display font-extrabold text-2xl"><span class="brand-gradient-text">Run</span><span class="text-gray-900">Pulse</span></span>
  </a>
</header>

<main class="flex-1 flex items-start justify-center px-4 pb-12">
  <div class="w-full max-w-sm bg-white rounded-2xl border border-gray-100 shadow-xl p-7">
    <h1 class="font-display font-bold text-xl text-center">Welcome back</h1>
    <p class="text-center text-xs text-gray-500 mt-1 mb-5">Sign in to manage your races and registrations</p>

    <div class="flex bg-gray-100 rounded-full p-1 mb-5 text-sm font-semibold">
      <button id="tabEmail" class="flex-1 py-2 rounded-full bg-white shadow text-rose-600">Email</button>
      <button id="tabMobile" class="flex-1 py-2 rounded-full text-gray-500">Mobile + OTP</button>
    </div>

    <!-- Email login -->
    <form id="emailForm" class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-500">Email</label>
        <input required type="email" placeholder="you@example.com" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500">Password</label>
        <input required type="password" placeholder="••••••••" class="mt-1 w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-1.5 text-gray-500"><input type="checkbox" class="accent-rose-600"> Remember me</label>
        <a href="#" class="text-rose-600 font-semibold">Forgot password?</a>
      </div>
      <button type="submit" class="w-full rp-btn-primary text-white font-semibold py-2.5 rounded-full">Login</button>
    </form>

    <!-- Mobile OTP login -->
    <form id="mobileForm" class="hidden space-y-4">
      <div>
        <label class="text-xs font-semibold text-gray-500">Mobile Number</label>
        <div class="mt-1 flex gap-2">
          <span class="border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-500">+91</span>
          <input id="mobileInput" required type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" class="flex-1 border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
      </div>
      <button id="sendOtpBtn" type="button" class="w-full rp-btn-primary text-white font-semibold py-2.5 rounded-full">Send OTP</button>

      <div id="otpBlock" class="hidden space-y-3">
        <label class="text-xs font-semibold text-gray-500">Enter 4-digit OTP sent to your mobile (demo: 1234)</label>
        <div class="flex gap-2 justify-center">
          <input maxlength="1" class="otpDigit w-12 h-12 text-center border border-gray-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
          <input maxlength="1" class="otpDigit w-12 h-12 text-center border border-gray-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
          <input maxlength="1" class="otpDigit w-12 h-12 text-center border border-gray-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
          <input maxlength="1" class="otpDigit w-12 h-12 text-center border border-gray-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-rose-500">
        </div>
        <p id="otpError" class="hidden text-xs text-rose-600 text-center">Incorrect OTP. Try 1234 for this demo.</p>
        <button type="submit" class="w-full rp-btn-primary text-white font-semibold py-2.5 rounded-full">Verify &amp; Login</button>
      </div>
    </form>

    <p id="loginSuccess" class="hidden text-center text-sm text-emerald-600 font-semibold mt-4">✓ Logged in successfully (demo)</p>

    <p class="text-center text-sm text-gray-500 mt-6">New to RunPulse? <a href="register.html" class="text-rose-600 font-semibold">Create an account</a></p>
  </div>
</main>

<footer class="text-center text-xs text-gray-400 pb-6">© 2026 RunPulse India · <a href="privacy-policy.html" class="hover:text-gray-600">Privacy</a> · <a href="terms-of-service.html" class="hover:text-gray-600">Terms</a></footer>

<script src="assets/js/auth.js"></script>
</body>
</html>
